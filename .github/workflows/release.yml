name: Release
# Existing releases are immutable. A failed/incomplete public release requires a
# new version; this workflow never overwrites, deletes or appends release assets.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing unreleased vMAJOR.MINOR.PATCH tag matching project.yml'
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Fetch main ancestry
        run: git fetch origin main:refs/remotes/origin/main
      - name: Require intended Xcode (no fallback)
        run: |
          test -d "$DEVELOPER_DIR" || { echo '::error::Xcode 26.4.1 unavailable'; exit 1; }
          xcodebuild -version
          xcrun swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate release gate failure and immutability boundaries
        run: python3 Scripts/tests/test-release-gate.py
      - name: Three full SwiftPM runs, then exact-commit Release package
        run: python3 Scripts/release-gate.py "$TAG"
      - name: Publish gated artifact (existing release fails closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/publish-release.py "$TAG"
      - name: Keep gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence
          path: |
            build/release-gate/*.log
            build/release-gate/gate.json
          if-no-files-found: ignore
