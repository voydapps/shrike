name: CI
# Runs on every push to main and on pull requests, so a test that only fails on a
# hosted runner shows up long before a release tag is pushed (audit 2026-10-24 M4).
# Same toolchain and the same full `swift test` as the release gate; the gate
# itself still runs the suite three times on the tagged commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require intended Xcode (no fallback)
        timeout-minutes: 5
        run: |
          test -d "$DEVELOPER_DIR" || { echo '::error::Xcode 26.4.1 unavailable'; exit 1; }
          xcodebuild -version
          xcrun swift --version
      - name: Install XcodeGen (pinned version and checksum)
        timeout-minutes: 5
        run: bash Scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen-install"
      - name: Release-process tests
        timeout-minutes: 5
        run: python3 Scripts/tests/test-release-gate.py
      - name: Site and changelog page checks
        timeout-minutes: 5
        run: |
          bash Scripts/check-site.sh
          node Scripts/make-changelog-page.mjs --check
      - name: Full test suite
        timeout-minutes: 40
        run: |
          mkdir -p build/ci
          set -o pipefail
          xcrun swift test --package-path Packages/ShrikeKit 2>&1 | tee build/ci/swift-test.log
      - name: Release build (warnings are errors)
        timeout-minutes: 25
        run: |
          mkdir -p build/ci
          set -o pipefail
          xcodegen generate
          xcodebuild -scheme Shrike -configuration Release -derivedDataPath "$RUNNER_TEMP/dd-release" build 2>&1 | tee build/ci/release-build.log
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs
          path: build/ci/*.log
          if-no-files-found: ignore
          retention-days: 14
