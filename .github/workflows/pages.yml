name: Pages

# No push trigger (audit 2026-10-24 M1): a push to main used to publish the site
# before the release it names existed. Release.yml starts this workflow after a
# successful publish; by hand, run it with workflow_dispatch on main.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The page names a version in data-release-version; that release must exist.
      - name: The release named on the page exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -o 'data-release-version="[0-9.]*"' site/index.html | head -1 | sed 's/.*="//; s/"//')
          test -n "$version" || { echo '::error::no data-release-version in site/index.html'; exit 1; }
          gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null || { echo "::error::release v$version does not exist yet; the site must not name it"; exit 1; }
      # Also runs the changelog page check (node is on the runner).
      - run: bash Scripts/check-site.sh
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
